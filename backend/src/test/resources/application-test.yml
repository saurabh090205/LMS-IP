spring:
  application:
    name: shreenil-backend-test
  datasource:
    url: jdbc:h2:mem:shreenildb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/shreenil

app:
  auth:
    dev-bypass-enabled: true
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:5174"
