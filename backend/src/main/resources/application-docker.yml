server:
  port: 8081

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/shreenildb}
    username: ${SPRING_DATASOURCE_USERNAME:shreenil}
    password: ${SPRING_DATASOURCE_PASSWORD:shreenil_secret_dev}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    show-sql: false
  flyway:
    enabled: false

app:
  auth:
    dev-bypass-enabled: ${AUTH_DEV_BYPASS_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:80,http://localhost:8082,http://127.0.0.1:5173,http://127.0.0.1:5174}

logging:
  level:
    com.shreenil: INFO
    org.springframework.security: INFO
