server:
  port: 8081

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shreenildb}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:shreenil}
    password: ${SPRING_DATASOURCE_PASSWORD:shreenil_secret_dev}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    enabled: false

app:
  auth:
    dev-bypass-enabled: true
  cors:
    allowed-origins: "http://localhost:5180,http://localhost:5174,http://localhost:5173,http://localhost:3000"

logging:
  level:
    com.shreenil: INFO
    org.springframework.security: INFO
