services:
  postgres:
    image: postgres:16-alpine
    container_name: shreenil-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shreenildb}
      POSTGRES_USER: ${POSTGRES_USER:-shreenil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shreenil_secret_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shreenil} -d ${POSTGRES_DB:-shreenildb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: shreenil-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-shreenildb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-shreenil}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-shreenil_secret_dev}
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/shreenil
      AUTH_DEV_BYPASS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: "http://localhost:5180,http://localhost:5174,http://localhost:5173,http://localhost:3000"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
