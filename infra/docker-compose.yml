version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: shreenil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shreenildb}
      POSTGRES_USER: ${POSTGRES_USER:-shreenil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shreenil_secret_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shreenil} -d ${POSTGRES_DB:-shreenildb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: shreenil-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/shreenil-realm.json:/opt/keycloak/data/import/shreenil-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ../backend
      dockerfile: ../infra/Dockerfile
    container_name: shreenil-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-shreenildb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-shreenil}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-shreenil_secret_dev}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/shreenil
      APP_AUTH_DEV_BYPASS_ENABLED: "true"
      APP_CORS_ALLOWED_ORIGINS: "http://localhost:5180,http://localhost:5174,http://localhost:5173,http://localhost:3000"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

volumes:
  postgres_data:
    driver: local
